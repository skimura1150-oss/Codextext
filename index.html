<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Pet 生成メーカー</title>
  <style>
    :root { --bg:#0b1020; --panel:#141c33; --line:#2a3556; --text:#e7edff; --muted:#aeb8d8; --accent:#7dd3fc; }
    *{box-sizing:border-box} body{margin:0;font-family:"Inter","Noto Sans JP",sans-serif;background:radial-gradient(circle at top,#182543,var(--bg));color:var(--text)}
    .wrap{width:min(980px,92vw);margin:40px auto}
    .card{background:linear-gradient(160deg,#121a31,#0f1629);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
    h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:0 0 6px}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    label{font-size:.9rem;color:var(--muted);display:block;margin:8px 0 6px}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334066;background:#0d152a;color:var(--text)}
    textarea{min-height:90px;resize:vertical}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{padding:10px 14px;border-radius:10px;border:1px solid #456;background:#1b2a4c;color:var(--text);font-weight:700;cursor:pointer}
    .primary{background:#155e75;border-color:#0e7490}
    pre{white-space:pre-wrap;background:#0a1224;border:1px solid #2e3a5a;border-radius:12px;padding:14px;line-height:1.6}
    .tip{font-size:.9rem;color:#c2d6ff;background:#0f203f;border:1px solid #28467a;border-radius:10px;padding:10px;margin-top:12px}
    @media (max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>CodexのPet生成メーカー</h1>
      <p class="muted">パラメータを入力すると、<b>/hatch</b> や生成AIに渡せる「ペット仕様プロンプト」を自動生成します。</p>

      <div class="grid">
        <div>
          <label for="name">Pet名</label>
          <input id="name" value="NeoFox" />
        </div>
        <div>
          <label for="species">モチーフ</label>
          <input id="species" value="キツネ" />
        </div>
        <div>
          <label for="style">アートスタイル</label>
          <select id="style">
            <option>pixel-art 32x32</option><option>pixel-art 48x48</option><option>low-poly toon</option>
          </select>
        </div>
        <div>
          <label for="mood">性格</label>
          <input id="mood" value="好奇心旺盛でちょっと照れ屋" />
        </div>
      </div>

      <label for="colors">テーマカラー（カンマ区切り）</label>
      <input id="colors" value="#7dd3fc, #1e3a8a, #f8fafc" />

      <label for="actions">モーション案（カンマ区切り）</label>
      <input id="actions" value="idle, walk, jump, celebrate, sleep" />

      <label for="lore">バックストーリー（任意）</label>
      <textarea id="lore">夜のコーディング中にログから生まれた、デバッグが得意な小さな精霊。</textarea>

      <div class="row">
        <button class="primary" id="generate">プロンプトを生成</button>
        <button id="copy">コピー</button>
      </div>

      <h3>生成結果</h3>
      <pre id="result"></pre>
      <p class="tip">ヒント: 生成結果をそのまま Codex の /hatch や画像生成モデルに貼り付けると、pet.json / spritesheet 制作の土台として使えます。</p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const result = $('result');

    function buildPrompt() {
      const name = $('name').value.trim();
      const species = $('species').value.trim();
      const style = $('style').value;
      const mood = $('mood').value.trim();
      const colors = $('colors').value.trim();
      const actions = $('actions').value.split(',').map(v => v.trim()).filter(Boolean);
      const lore = $('lore').value.trim();

      return [
`あなたはCodex Pet制作者です。次の条件でカスタムPetを設計してください。`,
`- Name: ${name}`,
`- Motif: ${species}`,
`- Style: ${style}`,
`- Personality: ${mood}`,
`- Theme colors: ${colors}`,
`- Required animations: ${actions.join(', ')}`,
`- Lore: ${lore || 'なし'}`,
`出力要件:`,
`1) pet.jsonの項目案（name, description, personality, states, animation設定）`,
`2) spritesheet作成ガイド（各アニメのフレーム数と順番）`,
`3) 導入手順（配置パスと起動コマンド例）`,
`4) 改良案を3つ`
      ].join('\n');
    }

    function render() { result.textContent = buildPrompt(); }

    $('generate').addEventListener('click', render);
    $('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(result.textContent);
        $('copy').textContent = 'コピー済み';
        setTimeout(() => $('copy').textContent = 'コピー', 1200);
      } catch {
        $('copy').textContent = 'コピー失敗';
      }
    });

    render();
  </script>
</body>
</html>
